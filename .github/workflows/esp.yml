name: Build integrated ESP
on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct HTTPS download URL for your decrypted Free Fire MAX 2.132.1 IPA (visible in run inputs)'
        required: false
        type: string
jobs:
  build:
    runs-on: macos-15-intel
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Test geometry and build ESP library
        run: bash build-esp-macos.sh
      - name: Download original IPA
        if: ${{ inputs.ipa_url != '' }}
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --output build/original.ipa "$IPA_URL"
      - name: Package and verify integrated game IPA
        if: ${{ inputs.ipa_url != '' }}
        run: python3 package-esp.py --source build/original.ipa --library build/FFMAXESP.dylib --output build/FreeFireMAX-2.132.1-ESP-V2-TEST.ipa
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.ipa_url != '' }}
        with:
          name: FreeFireMAX-ESP-V2-IPA
          path: |
            build/FreeFireMAX-2.132.1-ESP-V2-TEST.ipa
            build/FreeFireMAX-2.132.1-ESP-V2-TEST.verification.json
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: FFMAXESP
          path: build/FFMAXESP.dylib
          if-no-files-found: error
